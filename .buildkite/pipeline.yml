steps:
  - label: ":shell: Run Shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/**

  - label: ":sparkles: Run lint checks"
    plugins:
      - plugin-linter#v4.1.0:
          id: nx-set-shas

  - label: ":test_tube: Run tests"
    plugins:
      - plugin-tester#v2.0.0:
